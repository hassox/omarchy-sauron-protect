name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The marketplace shows the manifest version and the release workflow tags
      # it, so the daemon must not drift from it.
      - name: Check manifest and daemon versions match
        run: |
          manifest=$(jq -r .version manifest.json)
          daemon=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' sauron/__init__.py)
          if [ "$manifest" != "$daemon" ]; then
            echo "::error::manifest.json is $manifest but sauron/__init__.py is $daemon"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Python Sauron supports, and the newest, which Omarchy ships.
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q sauron tools tests bin
      - run: python -m unittest discover -s tests -t . -v
