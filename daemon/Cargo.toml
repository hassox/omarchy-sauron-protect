[package]
name = "sauron"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
libc = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
ring = "0.17.14"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "process", "io-std", "io-util", "fs", "time", "signal", "sync", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"
webpki-roots = "1.0.9"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
